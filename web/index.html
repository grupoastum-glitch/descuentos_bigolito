<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Descuentos Bigolito | Ofertas y descuentos</title>
  <meta name="description" content="Descuentos Bigolito — encuentra los mejores descuentos y cupones del día. Únete a nuestros canales de Telegram y no te pierdas ninguna oferta.">
  <meta name="theme-color" content="#0B0B0E">

  <!-- Open Graph: así se ve la tarjeta al compartir el enlace en Telegram o WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Descuentos Bigolito | Ofertas y descuentos">
  <meta property="og:description" content="Descuentos Bigolito — encuentra los mejores descuentos y cupones del día. Únete a nuestros canales de Telegram.">
  <meta property="og:image" content="./images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./images/logo.svg">
  <link rel="apple-touch-icon" href="./images/icono-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* ---------------------------------------------------------------
       PALETA DE MARCA — es el único sitio que hay que tocar para
       cambiar los colores de todo el sitio.
       --------------------------------------------------------------- */
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            marca:      { DEFAULT: '#5B4BE8', oscuro: '#4A3BD1', claro: '#A99BFF' },
            vip:        { DEFAULT: '#E1A32B', texto:  '#1A1206' },
            superficie: { DEFAULT: '#1C1C21', alta:   '#25252B' },
            fondo: '#0B0B0E'
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Aplica el tema guardado antes del primer pintado, para que no
       haya un parpadeo blanco al entrar en modo oscuro. -->
  <script>
    if (localStorage.getItem('tema') === 'claro') {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <link rel="stylesheet" href="./css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-100 dark:bg-black text-gray-900 dark:text-white">

  <!-- Columna de ancho de teléfono, centrada también en escritorio.
       Es lo que hace que se lea como una app y no como una web. -->
  <div class="relative mx-auto flex h-[100dvh] w-full max-w-md flex-col overflow-hidden bg-gray-50 dark:bg-fondo">

    <header class="flex shrink-0 items-center justify-between gap-3 px-6 pb-4 pt-6">
      <div class="flex min-w-0 items-center gap-3">
        <img src="./images/logo-bigolito.jpg" alt="Descuentos Bigolito"
             class="h-10 w-10 shrink-0 rounded-full object-cover" />
        <div class="min-w-0">
          <p id="marca-saludo" class="text-xs text-gray-500 dark:text-neutral-500"></p>
          <p id="marca-nombre" class="truncate text-lg font-bold leading-tight text-gray-900 dark:text-white">Descuentos Bigolito</p>
        </div>
      </div>
      <button id="boton-tema" type="button" aria-label="Cambiar entre modo claro y oscuro"
              class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-gray-200 bg-white text-gray-600 transition active:scale-95 dark:border-white/5 dark:bg-superficie dark:text-neutral-300">
        <span id="caja-icono-tema" class="flex items-center justify-center"></span>
      </button>
    </header>

    <!-- El scroll vive aquí dentro, no en el body -->
    <main id="main-content" class="no-scrollbar flex-1 overflow-y-auto px-6 pb-32">

      <section id="section-home">
        <div class="mb-6 text-center">
          <h1 id="hero-titulo" class="mb-2 text-3xl font-extrabold tracking-tight">¡Bienvenido!</h1>
          <p id="hero-descripcion" class="px-2 text-sm leading-relaxed text-gray-600 dark:text-neutral-400"></p>
        </div>

        <!-- Canales y acceso VIP: se llenan desde data/config.json -->
        <div id="canales-lista" class="space-y-3.5"></div>

        <!-- Redes sociales -->
        <div id="redes-lista" class="mt-6 flex justify-center gap-3"></div>

        <!-- Feed de ofertas: se llena desde data/ofertas.json -->
        <div id="ofertas-feed" class="mt-10"></div>

        <p class="mt-8 text-center text-[11px] leading-relaxed text-gray-400 dark:text-neutral-600">
          Los descuentos dependen de cada comercio y pueden cambiar o agotarse sin aviso.
          Verifica siempre las condiciones antes de comprar.
        </p>
      </section>

      <!-- Aquí van las secciones nuevas que quieras añadir, como
           <section id="section-loquesea" class="hidden">. Ver js/app.js. -->

    </main>

    <nav id="nav-inferior" aria-label="Navegación principal"
         class="safe-bottom absolute bottom-0 left-0 right-0 z-40 flex items-center justify-around rounded-t-[2.5rem] bg-marca px-6 pt-4 shadow-[0_-10px_40px_rgba(91,75,232,0.18)]"></nav>

  </div>

  <noscript>
    <p style="padding:2rem;text-align:center;font-family:sans-serif">
      Esta página necesita JavaScript activado para mostrar los canales y las ofertas.
    </p>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
